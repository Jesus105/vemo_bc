services:
  postgres:
    image: postgres:16-alpine
    container_name: vemo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-vemo}
    ports:
      # 5433 para no chocar con el Postgres de TaskNest (5432)
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data/raw:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vemo}"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
